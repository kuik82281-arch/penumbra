<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Inter, 'Segoe UI', 'Noto Sans SC', system-ui, sans-serif">
  <title>Penumbra architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6475"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#c9cfda;stroke-width:1.4}
      .w{fill:#eef1fb;stroke:#7f8fcf}
      .r{fill:#eaf5f2;stroke:#5fa38f}
      .s{fill:#1f2533;stroke:#1f2533}
      .t{font-size:14px;font-weight:600;fill:#1f2533}
      .st{font-size:14px;font-weight:600;fill:#ffffff}
      .d{font-size:11.5px;fill:#5b6475}
      .sd{font-size:11.5px;fill:#c9d1e3}
      .h{font-size:12px;font-weight:700;letter-spacing:.12em;fill:#5b6475}
      .l{stroke:#5b6475;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1200" height="470" fill="#fbfbfd"/>

  <text class="h" x="28" y="34">WRITE PATH · background</text>
  <g>
    <rect class="box w" x="28" y="50" width="180" height="78" rx="10"/>
    <text class="t" x="44" y="76">Originals</text><text class="d" x="44" y="96">append-only messages</text><text class="d" x="44" y="113">+ attachments, descriptions</text>
    <rect class="box w" x="238" y="50" width="180" height="78" rx="10"/>
    <text class="t" x="254" y="76">Segmentation</text><text class="d" x="254" y="96">30-min silence = a segment</text><text class="d" x="254" y="113">resumed topic carries context</text>
    <rect class="box w" x="448" y="50" width="210" height="78" rx="10"/>
    <text class="t" x="464" y="76">LLM curation</text><text class="d" x="464" y="96">record only what is new</text><text class="d" x="464" y="113">episodes · patterns · threads</text>
    <rect class="box w" x="688" y="50" width="210" height="78" rx="10"/>
    <text class="t" x="704" y="76">Validation</text><text class="d" x="704" y="96">schema · ids · verbatim quotes</text><text class="d" x="704" y="113">tombstones · all-or-quarantine</text>
    <path class="l" d="M208 89H236" marker-end="url(#a)"/><path class="l" d="M418 89H446" marker-end="url(#a)"/><path class="l" d="M658 89H686" marker-end="url(#a)"/>
    <path class="l" d="M898 89H960V170" marker-end="url(#a)"/>
  </g>

  <rect class="box s" x="900" y="172" width="270" height="118" rx="12"/>
  <text class="st" x="918" y="200">Memory store · SQLite</text>
  <text class="sd" x="918" y="222">Episode · Pattern (with history) · Thread</text>
  <text class="sd" x="918" y="240">kinds: commitment · vow · lexicon · routine · dream</text>
  <text class="sd" x="918" y="258">versions · audit · provenance → originals</text>
  <text class="sd" x="918" y="276">index: BM25 fields · vectors · entities</text>

  <text class="h" x="28" y="324">RECALL PATH · once per turn, locked to the turn</text>
  <g>
    <rect class="box r" x="28" y="340" width="150" height="96" rx="10"/>
    <text class="t" x="44" y="366">Entry gate</text><text class="d" x="44" y="386">small talk: no search</text><text class="d" x="44" y="403">past / picture: search</text>
    <rect class="box r" x="198" y="340" width="170" height="96" rx="10"/>
    <text class="t" x="214" y="366">Query</text><text class="d" x="214" y="386">time expressions → window</text><text class="d" x="214" y="403">stop-word seams dropped</text>
    <rect class="box r" x="388" y="340" width="190" height="96" rx="10"/>
    <text class="t" x="404" y="366">Hybrid retrieval</text><text class="d" x="404" y="386">BM25 + vectors + entities</text><text class="d" x="404" y="403">RRF · user name list</text>
    <rect class="box r" x="598" y="340" width="230" height="96" rx="10"/>
    <text class="t" x="614" y="366">Gates</text><text class="d" x="614" y="386">thresholds · patterns first</text><text class="d" x="614" y="403">seen · 24h cooldown · dedupe</text><text class="d" x="614" y="420">cross-encoder re-check</text>
    <rect class="box s" x="848" y="340" width="150" height="96" rx="10"/>
    <text class="st" x="864" y="366">≤ 2 memories</text><text class="sd" x="864" y="386">with evidence,</text><text class="sd" x="864" y="403">thread position,</text><text class="sd" x="864" y="420">image references</text>
    <rect class="box" x="1018" y="340" width="152" height="96" rx="10"/>
    <text class="t" x="1034" y="366">Review</text><text class="d" x="1034" y="386">mistake set replay</text><text class="d" x="1034" y="403">synthetic evaluation</text><text class="d" x="1034" y="420">quarantine queue</text>
    <path class="l" d="M178 388H196" marker-end="url(#a)"/><path class="l" d="M368 388H386" marker-end="url(#a)"/><path class="l" d="M578 388H596" marker-end="url(#a)"/><path class="l" d="M828 388H846" marker-end="url(#a)"/><path class="l" d="M998 388H1016" marker-end="url(#a)"/>
    <path class="l" d="M1035 290V312H483V338" marker-end="url(#a)"/>
  </g>
</svg>
